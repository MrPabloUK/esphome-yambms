# Native dump master with flow_control_pin (talk_pin). Do not also include
# board_options_itf_uart_flow_control.yaml on the same UART: that would drive
# DE/RE twice. Do not load jk_rs485_sniffer / jk_rs485_bms on the same ESP.

substitutions:
  sniffer_id: "jk_sniffer_1"
  sniffer_name: "JK sniffer"

packages:
  modbus_sniffer: !include bms_base_sniffer_sub_device.yaml

# +--------------------------------------+
# | Component settings                   |
# +--------------------------------------+

external_components:
  - source: github://MrPabloUK/esphome-jk-rs485-native@main
    refresh: 0s
    components: [ jk_rs485_native_master , jk_rs485_native_bms ]
  # - source:
  #     type: local
  #     path: ../esphome-jk-rs485-native/components

jk_rs485_native_master:
  - id: ${sniffer_id}
    uart_id: ${sniffer_uart_id}
    flow_control_pin: ${sniffer_talk_pin}
    response_timeout: 200ms
    inter_byte_timeout: 30ms
    offline_retry_interval: 5s
    min_command_gap: 150ms
    turnaround: 25ms
    poll:
      cell_info: 1s
      settings: 30s
      device_info: 1h

# +--------------------------------------+
# | Component entities                   |
# +--------------------------------------+

switch:
  - platform: template
    device_id: sniffer_${sniffer_uart_id}
    name: "Broadcasting BMS settings to all BMS"
    icon: "mdi:cast"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    entity_category: config
    turn_on_action:
      - lambda: id(${sniffer_id}).set_broadcast_changes(true);
    turn_off_action:
      - lambda: id(${sniffer_id}).set_broadcast_changes(false);
